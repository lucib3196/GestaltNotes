name: gestalt notes dev
services:
  firebase_emulator:
    build:
      context: .
      dockerfile: Dockerfile.firebase-emulator
    ports:
      - "9099:9099"
      - "9199:9199"
      - "0.0.0.0:4000:4000"
    volumes:
      - ./emulator-data:/app/emulator-data
      - ./firebase.json:/app/firebase.json:ro
      - ./storage.rules:/app/storage.rules:ro
      - ./.firebaserc:/app/.firebaserc:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "Promise.all([fetch(''http://127.0.0.1:9099''), fetch(''http://127.0.0.1:9199'')]).then(() => process.exit(0)).catch(() => process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    working_dir: /app

  gestalt_notes_backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
      firebase_emulator:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/gestalt_notes
      APP_ENV: docker
      FIREBASE_AUTH_EMULATOR_HOST: firebase_emulator:9099
      STORAGE_EMULATOR_HOST: http://firebase_emulator:9199
    env_file:
      - ./backend/.env.docker
    ports:
      - 8000:8000
    volumes:
      - ./backend:/app/backend # mount project allows for reloading
      - ./packages/object_store:/app/packages/object_store

  # Frontend
  gestalt_notes_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - ./frontend/.env.dev.docker
    ports:
      - 5173:5173
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # POSTGRES DB as a volume
  db:
    image: postgres:18
    container_name: gestalt_notes_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gestalt_notes
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestalt_notes"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: customuser
      RABBITMQ_DEFAULT_PASS: custompassword
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: "redis-server --save 60 1 --loglevel warning"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  celery_worker:
    build: 
      context: .
      dockerfile: backend/Dockerfile.celery.dev
    command: celery -A worker worker --loglevel=info
    env_file:
      - ./backend/.env.docker
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
