name: gestalt notes dev
services:
  gestalt_notes_backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/gestalt_notes
      ENV: dev
    env_file:
      - ./backend/.env.docker
    ports:
      - 8000:8000
    volumes:
      - ./backend:/app/backend # mount project allows for reloading

  # Frontend 
  gestalt_notes_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - ./frontend/.env.dev.docker
    ports:
      - 5173:5173
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # POSTGRES DB as a volume
  db:
    image: postgres:18
    container_name: gestalt_notes_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gestalt_notes
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestalt_notes"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # langgraph:
  #   build:
  #     context: ./ai_agents
  #     dockerfile: Dockerfile
  #   environment:
  #     ENV: dev
  #   ports:
  #     - 2024:2024
  #   volumes:
  #     - ./ai_agents:/deps/ai_agents # mount project allows for reloading

volumes:
  postgres_data:
