[project]
name = "multimodal-llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Luciano Bermudez", email = "lberm007@ucr.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
]

[project.scripts]
multimodal-llm = "multimodal_llm:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "C4",  # comprehensions
    "TID", # tidy imports
    "RUF", # Ruff-specific
    "ASYNC", # async issues
    "ANN", # type annotations
    "RET", # return issues
    "ARG", # unused arguments
    "PTH", # pathlib recommendations
]

ignore = [
    "ANN101", # missing self annotation
    "ANN102", # missing cls annotation
]
