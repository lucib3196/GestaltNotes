[project]
name = "document-annotator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Luciano Bermudez", email = "lberm007@ucr.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "ipython>=9.17.1",
    "matplotlib>=3.11.2",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
]

[project.scripts]
document-annotator = "document_annotator:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
