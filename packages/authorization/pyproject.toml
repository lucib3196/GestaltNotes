[project]
name = "authorization"
version = "0.2.2"
description = "Reusable access and ownership policies."
readme = "README.md"
authors = [
    { name = "Luciano Bermudez", email = "lberm007@ucr.edu" }
]
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
