[project]
name = "object-store"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Luciano Bermudez", email = "lberm007@ucr.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "firebase-admin>=7.7.0",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
object-store = "object_store:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["F401"]
"tests/**/*.py" = ["ANN", "ARG"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "C4",  # comprehensions
    "TID", # tidy imports
    "RUF", # Ruff-specific
    "ASYNC", # async issues
    "ANN", # type annotations
    "RET", # return issues
    "ARG", # unused arguments
    "PTH", # pathlib recommendations
]

ignore = [
    "ANN101", # missing self annotation
    "ANN102", # missing cls annotation
]
