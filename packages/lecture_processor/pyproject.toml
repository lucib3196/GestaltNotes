[project]
name = "lecture-processor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Luciano Bermudez", email = "lberm007@ucr.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "document-processing",
    "multimodal-llm",
    "pydantic>=2.13.5",
    "semantic-splitter",
]

[project.scripts]
lecture-processor = "lecture_processor:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
semantic-splitter = { path = "../semantic_splitter" }
multimodal-llm = { path = "../multimodal_llm" }
document-processing = { path = "../document_processing", editable = true }

[dependency-groups]
dev = [
    "langchain>=1.4.3",
    "langchain-google-genai>=4.4.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.16.10",
]
